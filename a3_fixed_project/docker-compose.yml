# MagicStudy Docker Compose
# 当前阶段：仅用 Docker 运行 Qdrant，Python 后端在 Windows 本机运行，便于排查。
# 镜像版本通过根目录 .env 的 QDRANT_IMAGE 固定，不使用 latest。
services:
  qdrant:
    image: ${QDRANT_IMAGE}
    container_name: magicstudy-qdrant
    restart: unless-stopped
    ports:
      # 绑定到 127.0.0.1，避免未启用认证的 Qdrant 暴露到局域网
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      # 命名卷：重建容器后数据仍可保留
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    name: magicstudy-qdrant-storage
